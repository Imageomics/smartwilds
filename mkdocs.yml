site_name: SmartWilds
site_description: Code and documentation for SmartWilds, a multi-modal field sensing dataset from The Wilds, Ohio
site_author: SmartWilds team, Imageomics Institute
site_url: https://imageomics.github.io/smartwilds

repo_name: Imageomics/smartwilds
repo_url: https://github.com/Imageomics/smartwilds
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Data:
    - Overview: datasets/overview.md
    - Joining in space and time: datasets/joining.md
    - Darwin Core tables: datasets/darwin-core-tables.md
    - Dataset cards: datasets/dataset-cards.md
    - Field campaigns: datasets/field-campaigns.md
    - Camera-trap release note: CAMERA_TRAP_RELEASE.md
    - Supplemental material: SUPPLEMENTAL.md
    - Defect inventory: DEFECT_INVENTORY.md
  - Scripts:
    - Overview and environment: scripts/index.md
    - Darwin Core generation: scripts/darwin-core.md
    - Validation: scripts/validation.md
    - Arrival traces: scripts/arrival-traces.md
    - Georeferencing: scripts/georeferencing.md
    - Privacy screening: scripts/privacy-screening.md
    - Example, quickstart: scripts/examples.md
  - Analysis:
    - Cross-modal coordination: analysis/cross-modal-coordination.md
  - Agents:
    - Using agents on your own data: agents/index.md
    - How we used them: AGENT_ASSISTED_DOCUMENTATION.md
    - Guidelines to give the agent: agents/guidelines.md
  - Related repositories: legacy.md
  - Acknowledgements: acknowledgements.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Imageomics/smartwilds
    - icon: simple/huggingface
      link: https://huggingface.co/collections/imageomics/smartwilds
