[project]
name = "wilds-multimodal-data"
version = "0.1.0"
description = "Wildlife detection and species identification pipeline using MegaDetector v5 and BioCLIP v2"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "open-clip-torch>=2.24.0",
    "megadetector>=5.0.0",
    "tqdm>=4.65.0",
    "huggingface-hub>=0.19.0",
]
